<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="poupaj-bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#15370D"/>
      <stop offset="100%" stop-color="#2A7C13"/>
    </linearGradient>
    <clipPath id="poupaj-clip">
      <rect width="512" height="512" rx="116"/>
    </clipPath>
  </defs>
  <g clip-path="url(#poupaj-clip)">
    <rect width="512" height="512" fill="url(#poupaj-bg)"/>
    <circle cx="430" cy="84" r="150" fill="#76C457" fill-opacity="0.14"/>

    <!-- Simbolo coletivo (elos de economia conjunta, sem escudo) -->
    <circle cx="212" cy="174" r="44" stroke="#FFFFFF" stroke-width="18" fill="none"/>
    <circle cx="300" cy="174" r="44" stroke="#76C457" stroke-width="18" fill="none"/>

    <!-- Monograma PoupaJ -->
    <text
      x="256"
      y="346"
      text-anchor="middle"
      font-family="'Plus Jakarta Sans', 'DM Sans', 'Segoe UI', Arial, sans-serif"
      font-weight="800"
      font-size="96"
      letter-spacing="-2"
    >
      <tspan fill="#FFFFFF">Poupa</tspan><tspan fill="#76C457">J</tspan>
    </text>

    <!-- Barra de progresso coletivo -->
    <rect x="136" y="386" width="240" height="16" rx="8" fill="#15370D" fill-opacity="0.55"/>
    <rect x="136" y="386" width="176" height="16" rx="8" fill="#76C457"/>
  </g>
</svg>
